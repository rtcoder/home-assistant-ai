services:
  device:
    build:
      context: .
      dockerfile: Dockerfile.device
    container_name: home-voice-ai-device
    devices:
      - "/dev/snd:/dev/snd"
    environment:
      - MQTT_BROKER=${MQTT_BROKER:-192.168.1.10}
      - MQTT_PORT=${MQTT_PORT:-1883}
      - DEVICE_ID=${DEVICE_ID:-kitchen-node}
    restart: unless-stopped
